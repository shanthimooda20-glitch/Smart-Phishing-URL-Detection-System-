services:
  - type: web
    name: smart-phishing-url-detection
    env: python
    buildCommand: "pip install -r requirements.txt && python src/ml/train.py"
    startCommand: "gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
